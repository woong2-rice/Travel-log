<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>여행 기록장</title>
  <meta name="description" content="다녀온 곳을 칠하고, 내 여행 인생을 결산한다.">
  <meta name="theme-color" content="#F9F8F6">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="여행 기록장">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- 한글: Pretendard / 숫자: Newsreader -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/map.css">
  <link rel="stylesheet" href="styles/sheet.css">
  <link rel="stylesheet" href="styles/timeline.css">
  <link rel="stylesheet" href="styles/analytics.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div id="app" class="app" data-view="map"></div>
  <noscript><p style="padding:24px">여행 기록장은 자바스크립트가 켜져 있어야 열려요.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('서비스워커 등록 실패', err));
      });
    }
  </script>
</body>
</html>
